# Renderiza os slides para public/slides/, que o Vite publica junto com o site.
# Uso: npm run slides (ou `quarto render` nesta pasta). O deploy no GitHub
# Actions roda isso antes do build; public/slides/ não vai para o git.
project:
  output-dir: ../../../public/slides
  render:
    - "aula*.qmd"
  resources:
    - pyret-mode.js
  # Junta as bibliotecas do reveal.js de todos os decks em public/slides/libs/.
  post-render: compartilha-libs.py

# A caixa do modelo recursivo aparece vazia e o texto entra no clique seguinte.
filters:
  - modelo-recursivo.lua

