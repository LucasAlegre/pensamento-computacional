<script type="module">
// Blocos `::: {.pyret-live}` ganham um botão que troca o código estático por um
// editor Pyret executável (mesma biblioteca usada no site). O editor só é carregado
// sob demanda, então a apresentação continua funcionando offline. Com o editor
// aberto, "Tela cheia" põe o bloco em tela cheia sem recarregar o editor.
// Atributos opcionais no bloco: data-height="420" (altura em px), data-autorun="false".
const EMBED_URL = "https://cdn.jsdelivr.net/npm/@ironm00n/pyret-embed@0.0.1/dist/pyret.js";

function codigoDo(box) {
  const codigo = [...box.querySelectorAll("pre code")]
    .map((c) => c.textContent.trimEnd())
    .join("\n\n");
  return /^\s*use context/.test(codigo) ? codigo : `use context starter2024\n\n${codigo}`;
}

async function abrir(box, botao) {
  botao.disabled = true;
  botao.textContent = "Carregando…";
  const editor = document.createElement("div");
  editor.className = "pyret-live-editor";
  editor.style.height = `${box.dataset.height || 420}px`;
  box.append(editor);
  box.classList.add("aberto");
  try {
    const { makeEmbedConfig } = await import(EMBED_URL);
    const embed = await makeEmbedConfig({
      container: editor,
      state: {
        editorContents: codigoDo(box),
        replContents: "",
        definitionsAtLastRun: "",
        interactionsSinceLastRun: [],
      },
      options: { footerStyle: "hide", warnOnExit: false },
    });
    if (box.dataset.autorun !== "false") embed.runDefinitions();
  } catch (erro) {
    editor.innerHTML = `<p class="pyret-live-erro">Não foi possível carregar o editor Pyret (${erro.message}).</p>`;
  }
  botao.disabled = false;
  botao.textContent = "✕ Fechar editor";
  box.querySelector(".pyret-live-tela").hidden = !box.requestFullscreen;
}

function fechar(box, botao) {
  if (document.fullscreenElement === box) document.exitFullscreen();
  box.querySelector(".pyret-live-editor")?.remove();
  box.classList.remove("aberto");
  box.querySelector(".pyret-live-tela").hidden = true;
  botao.textContent = "▶ Executar no Pyret";
}

function criarBotao(texto, classe) {
  const botao = document.createElement("button");
  botao.type = "button";
  botao.className = `pyret-live-btn ${classe}`;
  botao.textContent = texto;
  return botao;
}

for (const box of document.querySelectorAll(".pyret-live")) {
  const barra = document.createElement("div");
  barra.className = "pyret-live-barra";
  const tela = criarBotao("⤢ Tela cheia", "pyret-live-tela");
  tela.hidden = true;
  tela.addEventListener("click", () =>
    document.fullscreenElement === box ? document.exitFullscreen() : box.requestFullscreen(),
  );
  const botao = criarBotao("▶ Executar no Pyret", "pyret-live-executar");
  botao.addEventListener("click", () =>
    box.classList.contains("aberto") ? fechar(box, botao) : abrir(box, botao),
  );
  barra.append(tela, botao);
  box.prepend(barra);
}

// Esc também sai da tela cheia, então o texto do botão segue o estado do navegador.
document.addEventListener("fullscreenchange", () => {
  for (const tela of document.querySelectorAll(".pyret-live-tela")) {
    const cheia = document.fullscreenElement === tela.closest(".pyret-live");
    tela.textContent = cheia ? "⤡ Sair da tela cheia" : "⤢ Tela cheia";
  }
});
</script>
